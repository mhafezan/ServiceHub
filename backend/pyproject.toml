# Defines ServiceHub's Python package, runtime dependencies, and verification tools.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "servicehub"
version = "0.1.0"
description = "Transactional, agent-assisted Telegram services for Ontario"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<3",
  "pymysql[rsa]>=1.1,<2", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "openai>=1.68,<3", "python-telegram-bot>=22,<23",
  "google-cloud-tasks>=2.19,<3", "google-auth>=2.38,<3", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyMySQL", "httpx2>=2,<3"]

[project.scripts]
servicehub = "servicehub.operations.cli:main"

[tool.setuptools.packages.find]
include = ["servicehub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: requires a real MySQL database"]

[tool.coverage.run]
branch = true
source = ["servicehub"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
